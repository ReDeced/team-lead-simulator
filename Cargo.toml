[package]
name = "team-lead-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
macroquad = "0.4.16"
rand = "0.10.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }

[build-dependencies]
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_json = "1.0.151"

[[bin]]
name = "copy-wasm"
path = "scripts/copy-wasm.rs"
